<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Your Name</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background-color: #f5f8fc; }
  .navbar-brand { font-weight: 700; color: #fff !important; }
  .card { border: 1px solid #dbe7f7; }
  h1, h2, h5, h6 { color: #0b3d91; }
  footer { padding: 1.5rem 0; color: #6c757d; }

  .navbar { background: linear-gradient(90deg, #0d6efd 0%, #0b5ed7 100%) !important; }

  .btn { transition: transform 0.15s ease; }
  .btn:active { transform: scale(0.95); }
  .btn-primary { background-color: #0d6efd; border-color: #0d6efd; }
  .btn-outline-secondary { color: #0b3d91; border-color: #0b3d91; }
  .btn-outline-secondary:hover { background-color: #0b3d91; border-color: #0b3d91; }

  .nav-link { position: relative; }
  .nav-link::after {
    content: '';
    position: absolute;
    left: 50%; bottom: 2px;
    width: 0; height: 2px;
    background: #fff;
    transition: width 0.3s ease, left 0.3s ease;
  }
  .nav-link:hover::after,
  .nav-link.active::after {
    width: 70%; left: 15%;
    .navbar-nav .nav-link { color: #ffffff !important; }
  .navbar-nav .nav-link:hover { color: #e0ecff !important; }
  }
  .form-control:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 4px rgba(13,110,253,0.15);
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }
</style>
</head>
<body>

<nav class="navbar navbar-expand-md navbar-light bg-white border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Carl Joshua Tulio</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="skills.html">Skills</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <h1 class="mb-4">Contact</h1>
  <div class="mb-4">
  <span style="display:inline-block; width:60px; height:3px; background:#0d6efd; border-radius:2px;"></span>
  </div>
  <div class="row g-5">
    <div class="col-lg-5">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Details</h5>
          <ul class="list-unstyled mb-0">
            <li class="mb-2"><strong>Email:</strong> carljoshuatulio@gmail.com</li>
            <li class="mb-2"><strong>Location:</strong> Mandaluyong City, Philippines</li>
            <li class="mb-2"><strong>GitHub:</strong> https://github.com/cjtulio30/portfolio</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="col-lg-7">
      <form id="contactForm">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
        <p id="formStatus" class="mt-3 text-success d-none">
        </p>
      </form>
    </div>
  </div>
</div>

<footer class="text-center border-top">
  <div class="container">© <span id="year"></span> Cj Tulio</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
document.getElementById('contactForm').addEventListener('submit', function(e){
  e.preventDefault();
  document.getElementById('formStatus').classList.remove('d-none');
  this.reset();
});
</script>
</body>
</html>
